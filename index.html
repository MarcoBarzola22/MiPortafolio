<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portafolio Marco Barzola</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="The Barzola Times — Portafolio de ingeniería de software y diseño editorial de Marco Barzola." />
    <meta name="author" content="Marco Barzola" />

    <!-- Anti-FOUC Theme Initialization (Morning / Evening Edition) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('gazette-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'evening' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preload critical fonts for Zero CLS & Instant First Paint -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph -->
    <meta property="og:title" content="The Barzola Times — Marco Barzola | Portafolio Editorial" />
    <meta property="og:description" content="Portafolio de ingeniería de software y diseño editorial de Marco Barzola." />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Barzola Times — Marco Barzola" />
    <meta name="twitter:description" content="Portafolio de ingeniería de software y diseño editorial de Marco Barzola." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
