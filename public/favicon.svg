<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Newspaper background page -->
  <rect x="2" y="2" width="28" height="28" rx="4" fill="#FBF8F5" stroke="#1A1817" stroke-width="2"/>
  
  <!-- Masthead top bar -->
  <path d="M6 7h20" stroke="#1A1817" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 10h20" stroke="#1A1817" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Lead article picture with mint tone -->
  <rect x="6" y="13" width="9" height="7" rx="1" fill="#14B8A6" fill-opacity="0.35" stroke="#1A1817" stroke-width="1.2"/>
  
  <!-- Side article text lines -->
  <path d="M18 14h8M18 17h8M18 20h6" stroke="#1A1817" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Bottom columns -->
  <path d="M6 24h9M18 24h8" stroke="#1A1817" stroke-width="1.4" stroke-linecap="round"/>
</svg>
